[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai"
version = "0.1.0"
description = "Local-first AI developer assistant MVP for Obsidian knowledge access."
readme = "../README.md"
requires-python = ">=3.10"

[project.scripts]
personal-ai = "cli_app.entry:main"
personal-ai-web = "web_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
